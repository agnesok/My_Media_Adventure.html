<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>My Media Adventure</title>
</head>

<body>

  <center>

    <h1>My Media Adventure</h1>

    <p>
      Welcome! Enjoy urself by listening to music, watch a video or play a game
    </p>

    <h2>Space mission</h2>

    <p>
      These images show exciting space adventure.
    </p>

    <img src="rocket.jpg" alt="A rocket flying into space" width="300" height="300">
    <img src="color.webp" alt="A colourful planet in space" width="300" height="300">
    <img src="astronaut.jpeg" alt="An astronaut exploring space" width="300" height="300">

    <hr>

    <h2>Aquatic party</h2>

    <p>
      Play the music and enjoy the aquatic animal video.
    </p>

    <audio controls>
      <source src="The_Little_Mermaid_-_Under_The_Sea_(mp3.pm).mp3">
    </audio>

  <br>

    <video width="500px" height="350" controls>
      <source src="2 Minutes of Relaxing Ocean Animals.mp4" type="video/mp4">
    </video>

    <hr>

    <h2> Games to play</h2>

    <p>
      Play this Scratch game and enjoy.
    </p>

    <iframe 
      src="https://scratch.mit.edu/projects/60917032/embed"
      allowtransparency="true"
      width="500"
      height="400"
      frameborder="0"
      scrolling="no"
      allowfullscreen>
    </iframe>

  </center>

</body>

</html>
